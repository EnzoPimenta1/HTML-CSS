<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando</title>
    <style>
        div {
            display: flex;
            flex-direction: column;
            width: 500px;}

        input {
            height: 25px;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>Aprendendo formulários</h1>
    <form>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Usuário">

            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Usuário">

            <label for="date">Data</label>
            <input type="date" id="date">

            <label for="textarea">Texto</label>
            <textarea name="textarea" id="textarea" rows="10" cols="50"></textarea>

            <input type="submit" value="enviar form">

            <input type="reset" value="limpar">
        </div>
    </form>
</body>
</html>
