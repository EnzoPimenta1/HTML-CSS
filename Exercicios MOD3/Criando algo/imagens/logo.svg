<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"></stop>
      <stop offset="100%" stop-color="#6D28D9"></stop>
    </linearGradient>
  </defs>

  <!-- Wave Icon -->
  <path d="M120 180 
           C 180 80, 260 80, 320 180 
           C 280 150, 220 150, 180 180 
           C 160 200, 140 200, 120 180 Z" fill="url(#waveGradient)"></path>

  <!-- Circuit Dots -->
  <circle cx="210" cy="120" r="6" fill="#A855F7"></circle>
  <circle cx="250" cy="100" r="6" fill="#A855F7"></circle>
  <circle cx="290" cy="120" r="6" fill="#A855F7"></circle>

  <!-- Circuit Lines -->
  <line x1="210" y1="120" x2="250" y2="100" stroke="#A855F7" stroke-width="3"></line>
  <line x1="250" y1="100" x2="290" y2="120" stroke="#A855F7" stroke-width="3"></line>

  <!-- Text -->
  <text x="360" y="175" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#111111">
    Tech<tspan fill="url(#waveGradient)">Wave</tspan>
  </text>
</svg>