<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
        font-family: Arial, Helvetica, sans-serif;}

        td {
        border: 1px solid rgb(158, 158, 158);
        padding: 8px;
        text-align: center;
        vertical-align: middle;}
        
        table {
        width: 400px;
        height: 400px;
        border-collapse: collapse;
        margin: auto;}

        tr#one {
        background-color: white;}

        tr#two {
        background-color: grey;}

        tr#three {
        background-color: rgb(63, 63, 63);
        color: white;}

        tr#four {
        background-color: black;
        color: white;}

        h1 {
        text-align: center;
        font-family: 'Times New Roman', Times, serif;
        font-weight: 300;}
    </style>
</head>
<body>
    <h1> <strong>Minha primeira tabela</strong> </h1>
    <table>
        <tr id="one">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr id="two">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr id="three">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr id="four">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
